[project]
name = "gate-quant"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-dotenv>=1,<2",
  "cryptography>=42,<46",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["gate_quant"]
